# Flicello on the cloud server (/srv/flicello): the studio behind Caddy, which gets and renews the HTTPS
# certificates for flicello.com by itself. Only Caddy publishes ports; the studio is reachable on the private
# "edge" network only. Secrets live in /srv/flicello/.env.studio (never in git, never in chat).
#   docker compose -f deploy/docker-compose.server.yml up -d --build
services:
  studio:
    build:
      context: ..
      dockerfile: Dockerfile
    image: flicello-studio:latest
    restart: unless-stopped
    env_file:
      - path: ../.env.studio
        required: false
    environment:
      VIDO_STUDIO_HTTPS: "1"                  # Caddy serves HTTPS: cookies are Secure
      VIDO_STUDIO_PROXY_NET: 172.30.0.0/24    # Caddy's address range: its X-Forwarded-For is believed
      VIDO_STUDIO_BRAIN: api
      VIDO_STUDIO_OWNER_BRAIN: api            # no Claude Code on the server
    expose:
      - "8765"
    volumes:
      - studio-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 1400m
    cpus: 1.8
    networks:
      - edge

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - studio
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  studio-data:
  caddy-data:
  caddy-config:
