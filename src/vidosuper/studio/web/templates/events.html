{% extends "base.html" %}
{% block title %}Events · {{ app_name }}{% endblock %}
{% block content %}
<p><a href="/admin">← Admin</a></p>
<h1>Events for {{ pid }}</h1>
<section class="card">
  {% if not events %}<p class="muted">None.</p>{% endif %}
  {% for e in events %}
  <div class="event lvl-{{ e.level }}"><span class="muted small">{{ e.at|ago }} · job {{ e.job_id or '-' }}</span><pre>{{ e.message }}</pre></div>
  {% endfor %}
</section>
{% endblock %}
