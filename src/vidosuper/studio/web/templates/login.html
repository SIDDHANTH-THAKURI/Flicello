{% extends "base.html" %}
{% block title %}Sign in · {{ app_name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <label>Name <input name="name" value="{{ name or '' }}" autocomplete="username" required maxlength="40" autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <p class="muted small">New here? Open the invite link you were sent.</p>
</section>
{% endblock %}
