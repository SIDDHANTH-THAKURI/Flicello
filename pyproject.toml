[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vidosuper"
version = "0.1.0"
description = "AI video editor: turns a folder of raw trip clips into a polished, shareable edit."
readme = "PLAN.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python>=4.9",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1",
  "pillow>=10.2",
  "pycairo>=1.25",
]

[project.optional-dependencies]
ai = [
  "faster-whisper>=1.0",
  "librosa>=0.10.2",
  "scenedetect>=0.6.4",
  "imagehash>=4.3",
  "jinja2>=3.1",
]
studio = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
  "anthropic>=0.40",
  "onnxruntime>=1.17",  # the portrait cut-out (MODNet) for designed talking videos
  "rlottie-python>=1.3",  # designer animations (Lottie)
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
vido = "vidosuper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vidosuper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
