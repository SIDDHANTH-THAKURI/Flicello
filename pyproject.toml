[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vidosuper"
version = "0.1.0"
description = "AI video editor: turns a folder of raw trip clips into a polished, shareable edit."
readme = "PLAN.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python>=4.9",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1",
  "pillow>=10.2",
  "pycairo>=1.25",
]

[project.optional-dependencies]
ai = [
  "faster-whisper>=1.0",
  "librosa>=0.10.2",
  "scenedetect>=0.6.4",
  "imagehash>=4.3",
  "jinja2>=3.1",
]
studio = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
  "anthropic>=0.40",
  # the portrait cut-out (MODNet) for designed talking videos: on Windows through DirectML (the GPU), elsewhere the
  # plain build (the server image; a cloud renderer adds CUDA's)
  "onnxruntime>=1.17; sys_platform != 'win32'",
  "onnxruntime-directml>=1.17; sys_platform == 'win32'",
  "rlottie-python>=1.3",  # designer animations (Lottie)
  "webauthn>=2.2",  # passkeys (sign in with Face ID / fingerprint / security key)
  "PyJWT[crypto]>=2.9",  # Google sign-in: the ID token's signature is checked against Google's keys
  "markdown>=3.7",  # the legal pages are written in markdown
  "httpx>=0.27",  # sign-in emails (Resend) and Google's token exchange; anthropic 1.x no longer brings it
  "google-genai>=2.30",  # the clip watcher: Gemini watches each clip with its sound (studio/brain/gemini.py)
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
vido = "vidosuper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vidosuper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
