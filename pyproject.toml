[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vidosuper"
version = "0.1.0"
description = "Flicello: an AI video studio on your own computer, driven by your own Claude."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python>=4.9",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1",
  "pillow>=10.2",
  "pycairo>=1.25",
]

[project.optional-dependencies]
ai = [
  "faster-whisper>=1.0",
  "ctranslate2>=4.0",  # faster-whisper's engine: asked directly whether a CUDA GPU is there
  "librosa>=0.10.2",
  "scenedetect>=0.6.4",
  "imagehash>=4.3",
  "jinja2>=3.1",
]
studio = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
  "anthropic>=0.40",
  # the AI models (cut-outs, depth, object removal, upscaling): on Windows any GPU through DirectML, elsewhere the
  # plain build (Apple Silicon's Core ML is in it); NVIDIA machines add the `nvidia` extra for CUDA
  "onnxruntime>=1.17; sys_platform != 'win32'",
  "onnxruntime-directml>=1.17; sys_platform == 'win32'",
  "rlottie-python>=1.3",  # designer animations (Lottie)
  "httpx>=0.27",  # the work agent's hands (work/fl.py) and service checks
  "google-genai>=2.30",  # the clip watcher: Gemini watches each clip with its sound (studio/brain/gemini.py)
  "keyring>=25",  # local Flicello: the person's keys in their keychain (local/keys.py)
  "psutil>=5.9",  # local Flicello: what this machine has (local/machine.py)
]
nvidia = ["onnxruntime-gpu>=1.20"]  # the models on an NVIDIA GPU (CUDA 12): every cut-out frame on the GPU
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
vido = "vidosuper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vidosuper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
