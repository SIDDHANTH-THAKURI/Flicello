# The owner's own style rules, seeded into their studio profile the first time it is created.
# (From config/lessons.md and their ratings; friends start with an empty profile and a few questions.)
# for: films (music edits made from footage), talks (voice and talking videos) or all.
- text: Never show the companion in the olive jacket.
  why: "ignore that girl, we won't be showing her"
  for: films
- text: No shots from inside a car or through a windshield.
  why: car shots have no clarity
  for: films
- text: No voices or stray speech in the clip sound; music and natural sound only.
  why: meaningless voices were rejected
  for: films
- text: No on-screen text in the film.
  why: '"GIVE WAY" was lame - just 2 words, no value'
  for: films
- text: Vivid, real colour; nothing dull.
  why: dull footage lost points
  for: films
- text: Transitions at a pace the eye can follow; no 1-second flicks between ideas.
  why: calm page turns beat fast flicks
  for: films
- text: A new video is a new idea, never a reskin of an earlier edit.
  why: '"new means new"'
  for: all
- text: Hard cuts only when motivated; otherwise short dissolves centred on the beat.
  why: '"no need for sudden cuts"'
  for: films
